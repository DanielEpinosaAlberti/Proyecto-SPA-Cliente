<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raidfinder Classic</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#inicio" aria-label="Raidfinder Classic, inicio">
      <img class="brand__logo" src="assets/raidfinder-logo.png" alt="Raidfinder Classic">
      <span class="brand__name">RAIDFINDER <span class="brand__edition">/ CLASSIC</span></span>
    </a>

    <nav class="navigation" aria-label="Navegación principal">
      <a href="#inicio">Home</a>
      <a href="#listado">Groups</a>
      <a href="#profile">Profile</a>
      <a href="#chat">Chat</a>
    </nav>

    <div class="account">
      <span class="account__name">Kaelthas_EU · Undead Mage</span>
      <a class="account__logout" href="#salir">Salir</a>
    </div>
  </header>

  <main class="contenido" id="inicio">
    <section id="listado" aria-labelledby="titulo-listado">
      <h1 id="titulo-listado">Grupos disponibles</h1>
      <p>Explora las próximas raids y consulta sus detalles.</p>
      <div id="grupos" class="grupos" aria-live="polite"></div>
    </section>

    <section id="detalle" class="detalle" aria-live="polite" hidden></section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
